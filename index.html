<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="f0lder — creative portfolio">
  <meta property="og:title" content="f0lder">
  <meta property="og:description" content="f0lder — creative portfolio">
  <meta property="og:url" content="https://f0lder.github.io">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#111111">
  <title>f0lder</title>
  <link rel="icon" href="icon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111111;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
      opacity: 0.04;
      pointer-events: none;
      z-index: 10;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      z-index: 1;
      animation: fadeIn 1.2s ease forwards;
      transition: transform 0.1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    p {
      font-size: 1.5em;
      text-align: center;
      user-select: none;
    }

    a {
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
      transition: color 0.3s, text-shadow 0.3s;
    }

    a:hover {
      color: #fad9d9;
      text-shadow:
        0 0 8px rgba(250, 217, 217, 0.9),
        0 0 20px rgba(250, 217, 217, 0.5),
        0 0 40px rgba(250, 217, 217, 0.2);
    }

  </style>
</head>

<body>

  <canvas id="bg"></canvas>
  <main>
    <p>Just go to <a href="https://f0lder.xyz">my portfolio</a>.</p>
  </main>

  <script>
    // --- Starfield ---
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }

    function initStars() {
      stars = Array.from({ length: 130 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.1 + 0.2,
        opacity: Math.random() * 0.7 + 0.1,
        delta: (Math.random() - 0.5) * 0.015
      }));
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        s.opacity += s.delta;
        if (s.opacity <= 0.05 || s.opacity >= 0.85) s.delta *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
        ctx.fill();
      }
      requestAnimationFrame(drawStars);
    }

    resize();
    initStars();
    drawStars();
    addEventListener('resize', () => { resize(); initStars(); });

    // --- Mouse parallax ---
    const main = document.querySelector('main');
    addEventListener('mousemove', e => {
      const dx = (e.clientX / innerWidth  - 0.5) * 18;
      const dy = (e.clientY / innerHeight - 0.5) * 18;
      main.style.transform = `translate(${dx}px, ${dy}px)`;
    });

    // --- Cursor trail ---
    const trail = [];
    addEventListener('mousemove', e => {
      const dot = document.createElement('div');
      dot.style.cssText = `
        position:fixed; left:${e.clientX}px; top:${e.clientY}px;
        width:4px; height:4px; border-radius:50%;
        background:rgba(250,217,217,0.6); pointer-events:none;
        transform:translate(-50%,-50%); z-index:9;
        transition:opacity 0.5s, transform 0.5s;
      `;
      document.body.appendChild(dot);
      trail.push(dot);
      requestAnimationFrame(() => {
        dot.style.opacity = '0';
        dot.style.transform = 'translate(-50%,-50%) scale(0)';
      });
      setTimeout(() => { dot.remove(); trail.splice(trail.indexOf(dot), 1); }, 500);
    });

    // --- Keyboard shortcut: Enter or Space ---
    addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        location.href = 'https://f0lder.xyz';
      }
    });
  </script>

</body>
</html>
